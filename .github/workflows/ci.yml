# Lint and format run in the local pre-push hook, so CI only runs what the hook does not.
# lint:probes is not a lint run. It checks that the lint config still catches what it should.
name: CI

on:
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint rules still fire
        run: pnpm lint:probes

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Server answers on /
        run: |
          PORT=3000 node .output/server/index.mjs &
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:3000/ && exit 0
            sleep 0.5
          done
          echo "Server did not answer with 200 on / within 10s" >&2
          exit 1
