# Lint and format run in the local pre-push hook, so CI only runs what the hook does not.
# lint:probes is not a lint run. It checks that the lint config still catches what it should.
name: CI

on:
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint rules still fire
        run: pnpm lint:probes

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Server answers on / and /api/auth/get-session
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/unused
          BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdefgh
          BETTER_AUTH_URL: http://localhost:3000
        run: |
          PORT=3000 node .output/server/index.mjs &
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:3000/ && curl -fsS http://localhost:3000/api/auth/get-session && exit 0
            sleep 0.5
          done
          echo "Server did not answer with 200 on / and /api/auth/get-session within 10s" >&2
          exit 1

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ruang
          POSTGRES_PASSWORD: ruang
          POSTGRES_DB: ruang_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ruang -d ruang_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://ruang:ruang@127.0.0.1:5433/ruang_test
      TEST_DATABASE_URL: postgres://ruang:ruang@127.0.0.1:5433/ruang_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # Vitest's global setup applies the migrations.
      - run: pnpm test

  # Boots the real production stack on an empty volume, so the image, the first-start migration, and the healthcheck are all exercised.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Throwaway production env
        run: |
          pw=$(openssl rand -hex 24)
          {
            echo "POSTGRES_PASSWORD=$pw"
            echo "DATABASE_URL=postgres://ruang:$pw@db:5432/ruang"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "BETTER_AUTH_URL=http://localhost:3300"
          } > .env.production
      - run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --wait
      - name: App answers, and the migration made the user table
        run: |
          curl -fsS http://127.0.0.1:3300/api/auth/get-session
          docker compose -f docker-compose.prod.yml --env-file .env.production exec -T db psql -U ruang -d ruang -tAc 'select count(*) from "user"'
      - if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production logs
