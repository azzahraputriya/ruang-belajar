# Postgres for local dev and tests. The port listens on localhost only. The live app uses docker-compose.prod.yml.
name: ruang-belajar

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ruang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruang}
      POSTGRES_DB: ${POSTGRES_DB:-ruang}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
