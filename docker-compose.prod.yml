# The live app and its own Postgres. A separate project from docker-compose.yml, so it never shares the dev database.
# Always run it with `--env-file .env.production`. The app reads that whole file, and the database gets only its password.
name: ruang-belajar-prod

services:
  app:
    build: .
    restart: unless-stopped
    # Passes stop signals to node, so restarts don't wait for the 10 second kill.
    init: true
    env_file: .env.production
    # Pinned to the volume below, so a missing or different value in .env.production can't put
    # uploads on the container's own disk, where a rebuild would delete them.
    environment:
      UPLOAD_DIR: /app/data/uploads
    # Localhost only. The Cloudflare Tunnel is the only way in from outside.
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # Healthy only once the server answers. The container runs the migrations first, so without this
    # `up --wait` returned while nothing was listening yet. Node's own fetch, so the image needs no curl.
    # It sends cf-connecting-ip like the tunnel does, so it doesn't trigger better-auth's missing-IP warning,
    # which is logged once per start.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/auth/get-session', { headers: { 'cf-connecting-ip': '127.0.0.1' } }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruang
      POSTGRES_DB: ruang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?pass --env-file .env.production}
    # No ports: only the app container can reach it.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: on first start Postgres runs a socket-only setup server that would pass a socket check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
  uploads:
